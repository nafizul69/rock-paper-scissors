<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoCk, Paper, Scissor</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Bengali:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3ecc8;--dim:#8d876b;--bg:#0b0708;--grey:#4a4a42;--win:#9be37a;--lose:#ff7a6b;--tie:#ffd23f;--bt:88px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:11px/1.7 "Press Start 2P","Noto Sans Bengali","Courier New",monospace;display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:640px;position:relative;z-index:1}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tie);outline-offset:2px}
.tabs{display:flex;background:rgba(20,16,16,.88)}
.tabs button{flex:1;background:none;border:3px solid transparent;padding:14px 4px;font-size:10px}
.tabs button[aria-selected=true]{background:var(--grey);border-color:var(--ink)}
.panel{position:relative;background:rgba(0,0,0,.84);border:3px solid var(--ink);margin:20px 12px 12px;padding:22px 14px}
.node{position:absolute;width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;background:var(--bg)}
.n1{top:-10px;left:-10px}.n2{top:-10px;right:-10px}.n3{bottom:-10px;left:-10px}.n4{bottom:-10px;right:-10px}
.row{display:flex;align-items:center;gap:14px;margin:22px 0;flex-wrap:wrap}
.row>label{flex:0 0 150px}
.lab{display:block;margin-bottom:6px}
#name{width:100%;background:none;border:0;border-bottom:3px solid var(--grey);color:var(--ink);font:inherit;padding:6px 0;text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:110px;height:16px;margin:0;border:3px solid var(--ink);border-radius:0;background:linear-gradient(to right,var(--ink) var(--p,50%),var(--grey) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:28px;background:var(--ink);border:3px solid #000;border-radius:0}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--ink);border:3px solid #000;border-radius:0}
.row b{min-width:34px;text-align:right}
.sw{width:28px;height:28px;padding:0;background:#000;border:3px solid var(--ink);position:relative}
.sw[aria-checked=true]::after{content:"";position:absolute;inset:3px;background:var(--ink)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.note{color:var(--dim);font-size:8px}
.langs{display:flex;flex-direction:column;gap:14px}
.langs button{background:#000;border:3px solid var(--grey);padding:14px;text-align:left}
.langs button[aria-pressed=true]{border-color:var(--ink);background:var(--grey)}

.hud{display:flex;justify-content:space-between;align-items:flex-start;font-size:10px;gap:6px}
.hud b{display:block;font-size:20px;margin-top:4px}
.hud .r{text-align:right}
#first{color:var(--tie);font-size:8px;padding-top:4px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;margin:6px 0}
.arena img{width:100%;max-width:210px;height:auto;image-rendering:pixelated;justify-self:center}
#iR{transform:scaleX(-1)}
.arena .hid{filter:brightness(0) opacity(.45)}
.vs{font-size:14px;color:var(--tie)}
#msg{min-height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;padding-bottom:6px}
#msg.win{color:var(--win)}#msg.lose{color:var(--lose)}#msg.tie{color:var(--tie)}
.shake{animation:shake .18s infinite}
.pop{animation:pop .5s 2}
@keyframes shake{50%{translate:0 -10px;rotate:4deg}}
@keyframes pop{50%{scale:1.15}}
.prow{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.plabel{flex:0 0 58px;align-self:center;font-size:8px;overflow:hidden}
.pick{flex:1;background:#1b1410;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 2px 10px;font-size:8px;min-width:0}
.pick img{width:100%;max-width:90px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.pick:active{transform:translate(4px,4px);box-shadow:none}
.pick:disabled{opacity:.45;cursor:wait}
#reset{display:block;margin:20px auto 0;background:none;border:3px solid var(--ink);padding:12px 16px;font-size:10px}
.keys{text-align:center;color:var(--dim);font-size:8px;margin:16px 0 0}
.sws{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.hc{width:30px;height:30px;padding:0;border:3px solid #000;box-shadow:0 0 0 3px var(--grey)}
.hc[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.cl{list-style:none;margin:0 0 20px;padding:0}
.cl li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:3px solid #1d1a14;flex-wrap:wrap}
.cl .tx{flex:1;min-width:140px;font-size:9px}
.cl .tx::before{content:"[ ] ";color:var(--dim)}
.cl .ok .tx::before{content:"[X] ";color:var(--win)}
.cl img{width:54px;height:40px;object-fit:cover;border:3px solid var(--ink)}
.sm{background:#000;border:3px solid var(--ink);padding:8px 10px;font-size:8px}
#chText,#jcode{flex:1;min-width:140px;background:none;border:3px solid var(--grey);color:var(--ink);font:inherit;font-size:9px;padding:8px;text-transform:uppercase}
#proof{border:3px solid var(--tie);padding:12px;margin-top:14px}
#proof .row{margin:12px 0}
#pad{width:100%;max-width:280px;aspect-ratio:2/1;background:#000;border:3px solid var(--ink);touch-action:none;display:block;cursor:crosshair}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:#000;padding:10px 14px;font-size:9px;border:3px solid var(--tie);max-width:92vw;text-align:center;z-index:9}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);pointer-events:none}
#bg[class^=bg-]{background-size:300% 300%;animation:shiftbg 14s ease infinite}
.bg-maroon{background-image:linear-gradient(135deg,#1a0508,#5a1224,#1a0508)}
.bg-night{background-image:linear-gradient(135deg,#050818,#25257a,#050818)}
.bg-sunset{background-image:linear-gradient(135deg,#2b0a3d,#c2410c,#2b0a3d)}
.bg-forest{background-image:linear-gradient(135deg,#04180e,#1f7a43,#04180e)}
.bg-ocean{background-image:linear-gradient(135deg,#031a2e,#0e8aa8,#031a2e)}
@keyframes shiftbg{50%{background-position:100% 100%}}
.fl{position:absolute;bottom:-100px;opacity:.2;image-rendering:pixelated;animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-125vh) rotate(360deg)}}
.bgb{width:30px;height:30px;padding:0;border:3px solid #000;box-shadow:0 0 0 3px var(--grey)}
.bgb[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.cpick{width:34px;height:34px;padding:0;border:3px solid var(--ink);background:none}
#title{font-size:20px;text-align:center;margin:10px 0 0;color:var(--tie);text-shadow:4px 4px 0 #000;letter-spacing:2px}
#title span{display:inline-block;animation:hop 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes hop{50%{translate:0 -12px}}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:22px 0 14px}
.stage img{width:30%;max-width:150px;image-rendering:pixelated;animation:bob 2.2s ease-in-out infinite}
.stage img:nth-child(2){animation-delay:-.7s}.stage img:nth-child(3){animation-delay:-1.4s}
@keyframes bob{50%{translate:0 -14px;rotate:-5deg}}
.modes{display:flex;justify-content:center;gap:12px;margin:14px 0}
.modes .sm[aria-pressed=true]{background:var(--ink);color:#000}
.big{display:block;margin:16px auto 4px;font-size:16px;padding:16px 30px;background:var(--tie);color:#000;border:4px solid var(--ink);box-shadow:5px 5px 0 #000;animation:pulse 1.2s ease-in-out infinite}
.big.alt{background:#000;color:var(--ink);font-size:11px;padding:12px 16px;animation:none}
@keyframes pulse{50%{scale:1.07}}
.bump{animation:bump .45s ease-in-out infinite}
@keyframes bump{50%{translate:0 -28px}}
img.lose{opacity:.5;filter:grayscale(.7)}
.sq{position:fixed;top:-14px;width:10px;height:10px;z-index:8;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{translate:var(--dx) 108vh;rotate:720deg}}
#code{font-size:30px;letter-spacing:8px;text-align:center;color:var(--tie);padding:14px 6px;border:4px dashed var(--ink);margin:12px 0;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{border-color:var(--tie)}}
#jcode{text-align:center;letter-spacing:6px;font-size:14px}
#lmsg{min-height:30px;color:var(--tie);font-size:9px;margin:14px 0}
.shares{gap:8px;margin:12px 0}
.center{justify-content:center}
@media (max-width:520px){:root{--bt:64px}body{font-size:10px}.row>label{flex-basis:100%}.tabs button{font-size:7px;padding:12px 2px}#title{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sq,.fl{display:none}}
.arena{position:relative}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.em{position:absolute;bottom:20%;width:46px;animation:rise 1.8s ease-out forwards}
@keyframes rise{to{translate:0 -90px;opacity:0}}
.spk{position:absolute;image-rendering:pixelated;opacity:0;animation:tw 1.2s ease-in-out forwards}
@keyframes tw{30%{opacity:1;scale:1.4}to{opacity:0;scale:.5;rotate:90deg}}
.rib{position:absolute;left:50%;top:50%;width:75%;translate:-50% -50%;image-rendering:pixelated;animation:pop .5s 2}
.eb{padding:4px}.eb img{width:28px;height:28px;display:block}
#emo{gap:6px;margin:12px 0}
#bg{image-rendering:pixelated}
.cl .sm[aria-pressed=true]{background:var(--ink);color:#000}
</style>
</head>
<body>
<div id="bg"><div id="floaters"></div></div>
<main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="start" data-i="start" aria-selected="true"></button>
    <button role="tab" data-tab="setting" data-i="setting" aria-selected="false"></button>
    <button role="tab" data-tab="lang" data-i="lang" aria-selected="false"></button>
    <button role="tab" data-tab="chal" data-i="chal" aria-selected="false"></button>
  </nav>
  <div class="panel">
    <i class="node n1"></i><i class="node n2"></i><i class="node n3"></i><i class="node n4"></i>

    <section id="tab-start">
      <h1 id="title" aria-label="RoCk, Paper, Scissor"></h1>
      <div class="stage"><img id="tR" alt=""><img id="tP" alt=""><img id="tS" alt=""></div>
      <div class="modes" id="diffs"></div>
      <div class="modes"><button class="sm" id="mCpu" data-i="vcpu"></button><button class="sm" id="mNet" data-i="online2"></button></div>
      <div class="row center"><button class="big" id="go" data-i="start"></button><button class="big alt" id="halla" hidden>হাল্লা বল</button></div>
    </section>

    <section id="tab-pre" hidden>
      <p class="lab" data-i="region"></p><div class="modes" id="regs"></div>
      <p class="lab" data-i="chpick"></p><ul class="cl" id="pch"></ul>
      <div class="row center"><button class="big alt" id="pSkip" data-i="skip"></button><button class="big" id="pGo" data-i="play" style="font-size:12px;padding:12px 20px"></button></div>
    </section>

    <section id="tab-lobby" hidden>
      <label class="lab" for="lname" data-i="pname"></label>
      <input id="lname" maxlength="8" autocomplete="off" spellcheck="false">
      <div class="row"><label data-i="hand"></label><div class="sws" id="lsws"></div></div>
      <div class="row center"><button class="sm" id="bHost" data-i="host"></button><button class="sm" id="bJoin" data-i="join"></button></div>
      <div id="hostBox" hidden>
        <div class="note" data-i="code"></div>
        <div id="code">-----</div>
        <div class="row shares">
          <button class="sm" data-s="native">SHARE</button><button class="sm" data-s="wa">WHATSAPP</button><button class="sm" data-s="tg">TELEGRAM</button><button class="sm" data-s="fb">FACEBOOK</button><button class="sm" data-s="x">X</button><button class="sm" data-s="copy">COPY</button>
        </div>
        <div class="note" id="lnote" hidden data-i="linknote"></div>
      </div>
      <div id="joinBox" hidden>
        <div class="row"><input id="jcode" maxlength="6" autocomplete="off" aria-label="Room code" placeholder="CODE"><button class="sm" id="jGo" data-i="join"></button></div>
      </div>
      <p id="lmsg" aria-live="polite"></p>
      <button class="sm" id="lBack" data-i="back"></button>
    </section>

    <section id="tab-game" hidden>
      <div class="board">
        <div class="hud">
          <div><span id="nL"></span><b id="sL">0</b></div>
          <div id="first"></div>
          <div class="r"><span id="nR"></span><b id="sR">0</b></div>
        </div>
        <div class="arena"><img id="iL" alt=""><span class="vs">VS</span><img id="iR" alt=""><div id="fx"></div></div>
        <div id="msg" aria-live="polite"></div>
      </div>
      <div id="chb" class="note" style="text-align:center;margin:8px 0"></div>
      <div id="emo" class="row center"></div>
      <div id="picks"></div>
      <div class="row center"><button class="sm" id="reset" data-i="again" hidden></button><button class="sm" id="mic" data-i="mic" hidden></button><button class="sm" id="leave" data-i="menu"></button></div>
      <p class="keys">1  2  3</p>
    </section>

    <section id="tab-setting" hidden>
      <label class="lab" for="name" data-i="pname"></label>
      <input id="name" maxlength="8" autocomplete="off" spellcheck="false">
      <div class="row"><label for="rounds" data-i="round"></label><input type="range" id="rounds" min="1" max="9"><b id="rv"></b></div>
      <div class="row"><label for="vol" data-i="sound"></label><input type="range" id="vol" min="0" max="100" step="5"><b id="vv"></b></div>
      <div class="row"><label data-i="multi"></label><button class="sw" id="multi" role="switch" aria-checked="false" aria-label="Multiplayer"></button></div>
      <div class="row"><label data-i="bgl"></label><div class="sws" id="bgs"></div><input type="file" id="bgfile" accept="image/*" hidden></div>
      <div class="row"><label data-i="hand"></label><div class="sws" id="sws"></div></div>
    </section>

    <section id="tab-chal" hidden>
      <p class="lab" data-i="sec1"></p>
      <ul class="cl" id="auto"></ul>
      <p class="lab" data-i="sec2"></p>
      <ul class="cl" id="mine"></ul>
      <div class="row"><input id="chText" maxlength="40" autocomplete="off" aria-label="New challenge"><button class="sm" id="chAdd" data-i="add"></button></div>
      <div id="proof" hidden>
        <div id="ptitle"></div>
        <div class="row"><button class="sm" id="pPhoto" data-i="photo"></button><button class="sm" id="pWrite" data-i="write"></button><button class="sm" id="pCancel" aria-label="Close">X</button></div>
        <input type="file" id="file" accept="image/*" hidden>
        <canvas id="pad" width="280" height="140" hidden></canvas>
        <div class="row" id="padBtns" hidden><button class="sm" id="padClear" data-i="clear"></button><button class="sm" id="padSave" data-i="save"></button></div>
      </div>
    </section>

    <section id="tab-lang" hidden>
      <div class="langs">
        <button data-l="bn">বাংলা</button>
        <button data-l="en">ENGLISH</button>
        <button data-l="es">ESPANOL</button>
        <button data-l="fr">FRANCAIS</button>
      </div>
    </section>
  </div>
</main>
<div id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

let ac;
function beep(freqs, dur=.09){
  if(!S.vol) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const g = ac.createGain(); g.gain.value = S.vol/100*.15; g.connect(ac.destination);
    freqs.forEach((f,i)=>{
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(g);
      o.start(ac.currentTime + i*dur); o.stop(ac.currentTime + (i+1)*dur);
    });
  }catch(e){}
}

function emoSound(k,dl){
  if(!S.vol||!ES[k]) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    let t0 = ac.currentTime + dl;
    ES[k].forEach(([a,b,d,ty]) => {
      if(a){ const o = ac.createOscillator(), g = ac.createGain(); o.type = ty || 'square';
        o.frequency.setValueAtTime(a,t0); o.frequency.linearRampToValueAtTime(b,t0+d);
        g.gain.setValueAtTime(S.vol/100*.2,t0); g.gain.linearRampToValueAtTime(0,t0+d);
        o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d); }
      t0 += d;
    });
  }catch(e){}
}

  myPick = m; lock(true); beep([440]);

// Both hands bump three times (ROCK, PAPER, SCISSORS) then SHOOT reveals
function countdown(){
  busy = true; lock(true);
  iL.src = A.rock; iR.src = AO.rock; iL.className = iR.className = 'bump';
  const w = [t('rock'), t('paper'), t('scissors'), 'SHOOT!']; let i = 0;
  const tick = () => {
    say(w[i], 'tie'); beep([260 + i*70]);
    if(++i < w.length) setTimeout(tick, 450); else setTimeout(() => reveal(myPick, oppPick), 380);
  };
  tick();
}

function reveal(a, b){
  iL.src = A[a]; iR.src = AO[b]; iL.className = iR.className = '';
  const w = a === b ? -1 : (BEATS[a] === b ? 0 : 1);
  const who = w ? oppName : S.name;
  if(w < 0){ say(t('tie'), 'tie'); beep([300,300]); }
  else {
    sc[w]++; (w ? iR : iL).classList.add('pop'); (w ? iL : iR).classList.add('lose');
    say(who + ' ' + t('wins'), w ? 'lose' : 'win'); beep(w ? [392,330,262] : [523,659,784]);
  }
  if(w >= 0){ emote(w, Math.random()<.5?'laugh':'money'); emote(1-w, Math.random()<.5?'cry':'angry', .4); spark(w,8); }
  myPick = oppPick = null; labels();
  if(mode === 'cpu'){
    if(w === 0){ streak++; if(streak >= 3) win('a1'); if(a === 'scissors') win('a2'); }
    else if(w === 1){ streak = 0; lost++; }
    if(w === 0 && sc[0] >= goal){ win('a3'); if(!lost) win('a4'); }
  }
  if(w >= 0 && sc[w] >= goal){
    over = true; busy = false; say(who + ' ' + t('gameWon'), w ? 'lose' : 'win');
    if(!w) confetti(); ribbon(!w); $('#reset').hidden = false;
  } else { busy = false; lock(false); }
}

// ---- Online play: PeerJS (public broker), 5-letter room code ----
const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rcode = () => Array.from({length:5}, () => ALPHA[Math.random()*ALPHA.length|0]).join('');
function closeNet(){
  try{ conn && conn.close(); }catch(e){} try{ peer && peer.destroy(); }catch(e){}
  if(mst){ mst.getTracks().forEach(x=>x.stop()); mst = null; $('#mic').textContent = t('mic'); }
  conn = peer = oppReady = null; oppPick = myPick = null;
}
function hostRoom(){
  if(!window.Peer) return lobbyMsg(t('nopeer'));
  closeNet(); isHost = true; $('#joinBox').hidden = true; lobbyMsg(t('connecting'));
  const code = rcode();
  peer = new Peer('pxrps-' + code);
  peer.on('open', () => { $('#code').textContent = code; $('#hostBox').hidden = false; lobbyMsg(t('waiting')); });
  peer.on('connection', c => { if(conn) c.close(); else setConn(c); });
  peer.on('error', e => e.type === 'unavailable-id' ? hostRoom() : lobbyMsg('ERROR: ' + e.type));
}
function joinRoom(){
  if(!window.Peer) return lobbyMsg(t('nopeer'));
  const code = $('#jcode').value.trim().toUpperCase(); if(code.length < 4) return;
  closeNet(); isHost = false; lobbyMsg(t('connecting'));
  peer = new Peer();
  peer.on('open', () => setConn(peer.connect('pxrps-' + code, {reliable:true})));
  peer.on('error', e => lobbyMsg(e.type === 'peer-unavailable' ? t('nocode') : 'ERROR: ' + e.type));
}
function setConn(c){
  conn = c; peer.on('call', k => { k.answer(mst || undefined); gotCall(k); });
  c.on('open', () => c.send({t:'hello', name:S.name, hand:S.hand, rounds:S.rounds}));
  c.on('data', onData);
  c.on('error', () => lobbyMsg('CONNECTION ERROR'));
  c.on('close', () => { conn = null; if(view === 'game'){ say(t('left'), 'lose'); lock(true); } else lobbyMsg(t('left')); });
}
function onData(d){
  if(!d || typeof d !== 'object') return;
  if(d.t === 'hello'){
    oppName = nm(String(d.name || '')) || 'P2';
    if(!isHost) goal = Math.min(9, Math.max(1, +d.rounds || 3));
    oppReady = getSet(HC.hasOwnProperty(d.hand) ? d.hand : 'stone').then(s => { AO = s; });
    if(isHost) oppReady.then(() => { conn.send({t:'start'}); startGame(); });
  }
  else if(d.t === 'start') (oppReady || Promise.resolve()).then(startGame);
  else if(d.t === 'pick' && M.includes(d.m) && !oppPick){
    oppPick = d.m;
    if(myPick) countdown(); else { iR.src = AO.rock; iR.className = 'hid'; say(oppName + ' ' + t('locked')); }
  }
  else if(d.t === 'emo' && EK.includes(d.e)) emote(1, d.e);
  else if(d.t === 'again'){ oppAgain = true; if(myAgain) rematch(); }
}

// ---- Hand colour: recolours the grey sprites by brightness ----
const HC = {stone:null, peach:[[190,110,90],[250,210,170]], tan:[[130,75,45],[215,160,115]], deep:[[60,35,28],[150,100,75]], red:[[120,20,30],[255,110,100]], blue:[[25,50,130],[130,185,255]], green:[[20,90,50],[130,230,150]], gold:[[130,85,10],[255,224,110]]};

  b.setAttribute('aria-label', k + ' hand'); b.style.background = HC[k] ? 'rgb(' + HC[k][1] + ')' : '#9a948c';
  b.onclick = () => setHand(k); $('#sws').appendChild(b); const b2 = b.cloneNode(); b2.onclick = () => setHand(k); $('#lsws').appendChild(b2);
});
function tint(src, c){
  return new Promise(res=>{
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
      const x = cv.getContext('2d'); x.drawImage(im,0,0);
      const d = x.getImageData(0,0,cv.width,cv.height), p = d.data;
      for(let i=0;i<p.length;i+=4){
        if(!p[i+3]) continue;
        const l = (p[i]*.299 + p[i+1]*.587 + p[i+2]*.114) / 255;
        if(l < .16) continue;                       // keep the dark outline
        const k = Math.min(1, Math.max(0, (l-.2)/.55));
        for(let j=0;j<3;j++) p[i+j] = c[0][j] + (c[1][j]-c[0][j])*k;
      }
      x.putImageData(d,0,0); res(cv.toDataURL());
    };
    im.src = src;
  });
}
const setCache = {};
function getSet(k){
  if(!HC[k]) return Promise.resolve(A0);
  return setCache[k] || (setCache[k] = Promise.all(M.map(m => tint(A0[m], HC[k]))).then(r => { const o = {}; M.forEach((m,i) => o[m] = r[i]); return o; }));
}

}
